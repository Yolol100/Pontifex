name: Planning persistence once

on:
  push:
    branches:
      - fix/bootstrap-and-compatibility-2026-09-09

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/bootstrap-and-compatibility-2026-09-09

      - name: Replace ineffective duplicate-key upsert
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('includes/api/class-soap-client.php')
          text = path.read_text()
          start_marker = '                $wpdb->query($wpdb->prepare(\n                    "INSERT INTO {$table_name}'
          end_marker = "                $seenIds[] = $data['planning_identifier'];\n"
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('planning persistence anchors are not unique')
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          replacement = '''                $formats = [
                    '%s', '%s', '%s', '%s', '%s', '%s', '%d', '%s', '%s',
                    '%s', '%s', '%s', '%s', '%s', '%s', '%s', '%d',
                ];
                $existing_id = $wpdb->get_var($wpdb->prepare(
                    "SELECT id FROM {$table_name} WHERE planning_identifier = %s LIMIT 1",
                    $planning_identifier
                ));

                if ($existing_id !== null) {
                    $persisted = $wpdb->update(
                        $table_name,
                        $data,
                        ['planning_identifier' => $planning_identifier],
                        $formats,
                        ['%s']
                    );
                } else {
                    $persisted = $wpdb->insert($table_name, $data, $formats);
                }

                if ($persisted === false) {
                    throw new \\RuntimeException('planning_persistence_failed');
                }

                $seenIds[] = $planning_identifier;
          '''
          path.write_text(text[:start] + replacement + text[end:])
          PY

          php -l includes/api/class-soap-client.php
          ! grep -Fq 'ON DUPLICATE KEY UPDATE' includes/api/class-soap-client.php
          grep -Fq 'SELECT id FROM {$table_name} WHERE planning_identifier = %s LIMIT 1' includes/api/class-soap-client.php
          grep -Fq '$wpdb->update(' includes/api/class-soap-client.php
          grep -Fq '$wpdb->insert($table_name, $data, $formats)' includes/api/class-soap-client.php
          grep -Fq "throw new \\RuntimeException('planning_persistence_failed');" includes/api/class-soap-client.php

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/planning-persistence-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add includes/api/class-soap-client.php
          git commit -m 'fix: persist planning by identifier without duplicate-key assumption'
          git push origin HEAD:fix/bootstrap-and-compatibility-2026-09-09
