name: Planning persistence once

on:
  push:
    branches:
      - fix/bootstrap-and-compatibility-2026-09-09

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/bootstrap-and-compatibility-2026-09-09

      - name: Replace ineffective duplicate-key upsert
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('includes/api/class-soap-client.php')
          text = path.read_text()
          old = '''                $wpdb->query($wpdb->prepare(
                    "INSERT INTO {$table_name}
                     (planning_identifier, planning_date, planning_time, planning_start_date, planning_updated, planning_status, available_seats, location_identifier, location_name, location_street, location_number, location_suffix, location_postcode, location_city, location_province, location_country, location_seats)
                     VALUES (%s, %s, %s, %s, %s, %s, %d, %s, %s, %s, %s, %s, %s, %s, %s, %s, %d)
                     ON DUPLICATE KEY UPDATE
                      planning_date = VALUES(planning_date),
                      planning_time = VALUES(planning_time),
                      planning_start_date = VALUES(planning_start_date),
                      planning_updated = VALUES(planning_updated),
                      planning_status = VALUES(planning_status),
                      available_seats = VALUES(available_seats),
                      location_identifier = VALUES(location_identifier),
                      location_name = VALUES(location_name),
                      location_street = VALUES(location_street),
                      location_number = VALUES(location_number),
                      location_suffix = VALUES(location_suffix),
                      location_postcode = VALUES(location_postcode),
                      location_city = VALUES(location_city),
                      location_province = VALUES(location_province),
                      location_country = VALUES(location_country),
                      location_seats = VALUES(location_seats)",
                    ...array_values($data)
                ));
                $seenIds[] = $data['planning_identifier'];
'''
          new = '''                $formats = [
                    '%s', '%s', '%s', '%s', '%s', '%s', '%d', '%s', '%s',
                    '%s', '%s', '%s', '%s', '%s', '%s', '%s', '%d',
                ];
                $existing_id = $wpdb->get_var($wpdb->prepare(
                    "SELECT id FROM {$table_name} WHERE planning_identifier = %s LIMIT 1",
                    $planning_identifier
                ));

                if ($existing_id !== null) {
                    $persisted = $wpdb->update(
                        $table_name,
                        $data,
                        ['planning_identifier' => $planning_identifier],
                        $formats,
                        ['%s']
                    );
                } else {
                    $persisted = $wpdb->insert($table_name, $data, $formats);
                }

                if ($persisted === false) {
                    throw new \\RuntimeException('planning_persistence_failed');
                }

                $seenIds[] = $planning_identifier;
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one legacy upsert block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

          php -l includes/api/class-soap-client.php
          ! grep -Fq 'ON DUPLICATE KEY UPDATE' includes/api/class-soap-client.php
          grep -Fq 'SELECT id FROM {$table_name} WHERE planning_identifier = %s LIMIT 1' includes/api/class-soap-client.php
          grep -Fq '$wpdb->update(' includes/api/class-soap-client.php
          grep -Fq '$wpdb->insert($table_name, $data, $formats)' includes/api/class-soap-client.php
          grep -Fq "throw new \\RuntimeException('planning_persistence_failed');" includes/api/class-soap-client.php

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/planning-persistence-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add includes/api/class-soap-client.php
          git commit -m 'fix: persist planning by identifier without duplicate-key assumption'
          git push origin HEAD:fix/bootstrap-and-compatibility-2026-09-09
