name: SOAP debug hardening once

on:
  push:
    branches:
      - fix/bootstrap-and-compatibility-2026-09-09

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/bootstrap-and-compatibility-2026-09-09

      - name: Harden SOAP debug output and normalize persistence block
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('includes/api/class-soap-client.php')
          text = path.read_text()

          persistence_start = '                $formats = [\n'
          persistence_end = '      $seenIds[] = $planning_identifier;\n'
          if text.count(persistence_start) != 1 or text.count(persistence_end) != 1:
              raise SystemExit('planning persistence formatting anchors are not unique')
          start = text.index(persistence_start)
          end = text.index(persistence_end, start) + len(persistence_end)
          persistence = '\n'.join([
              '                $formats = [',
              "                    '%s', '%s', '%s', '%s', '%s', '%s', '%d', '%s', '%s',",
              "                    '%s', '%s', '%s', '%s', '%s', '%s', '%s', '%d',",
              '                ];',
              '                $existing_id = $wpdb->get_var($wpdb->prepare(',
              '                    "SELECT id FROM {$table_name} WHERE planning_identifier = %s LIMIT 1",',
              '                    $planning_identifier',
              '                ));',
              '',
              '                if ($existing_id !== null) {',
              '                    $persisted = $wpdb->update(',
              '                        $table_name,',
              '                        $data,',
              "                        ['planning_identifier' => $planning_identifier],",
              '                        $formats,',
              "                        ['%s']",
              '                    );',
              '                } else {',
              '                    $persisted = $wpdb->insert($table_name, $data, $formats);',
              '                }',
              '',
              '                if ($persisted === false) {',
              "                    throw new \\RuntimeException('planning_persistence_failed');",
              '                }',
              '',
              '                $seenIds[] = $planning_identifier;',
              '',
          ])
          text = text[:start] + persistence + text[end:]

          debug_start = '    public function debugHandshake(bool $do_ping = false): array\n'
          debug_end = '        return $out;\n    }\n'
          if text.count(debug_start) != 1:
              raise SystemExit('debugHandshake start anchor is not unique')
          start = text.index(debug_start)
          end = text.index(debug_end, start) + len(debug_end)
          debug_method = '\n'.join([
              '    public function debugHandshake(bool $do_ping = false): array',
              '    {',
              "        $out = ['ok' => false, 'ping_attempted' => $do_ping];",
              '        try {',
              '            $client = $this->getClient();',
              "            $out['soap_functions'] = $client->__getFunctions();",
              '            if ($do_ping) {',
              "                $user_id = (int) get_option('pontifex_oi_soap_user_id', 0);",
              "                $hash = (string) get_option('pontifex_oi_soap_hash', '');",
              '',
              '                if ($user_id && $hash) {',
              "                    $client->__soapCall('getWalkInPlanning', [",
              "                        'user_identifier' => $user_id,",
              "                        'hash' => $hash,",
              '                    ]);',
              '                }',
              '            }',
              "            $out['ok'] = true;",
              '        } catch (\\Throwable $e) {',
              "            $out['error_type'] = get_class($e);",
              "            $out['error_code'] = (int) $e->getCode();",
              '        }',
              '        return $out;',
              '    }',
              '',
          ])
          text = text[:start] + debug_method + text[end:]
          path.write_text(text)
          PY

          php -l includes/api/class-soap-client.php
          ! grep -Fq '__getLastRequest()' includes/api/class-soap-client.php
          ! grep -Fq '__getLastResponse()' includes/api/class-soap-client.php
          ! grep -Fq "\$out['message']" includes/api/class-soap-client.php
          grep -Fq "\$out['error_type'] = get_class(\$e);" includes/api/class-soap-client.php

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/soap-debug-hardening-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add includes/api/class-soap-client.php
          git commit -m 'fix: keep SOAP debug output credential-safe'
          git push origin HEAD:fix/bootstrap-and-compatibility-2026-09-09
