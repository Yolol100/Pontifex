name: WordPress compatibility

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  planning-hardening:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/bootstrap-and-compatibility-2026-09-09' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/bootstrap-and-compatibility-2026-09-09

      - name: Apply bounded planning safety patch
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq '$reconciliation_safe = true;' includes/api/class-soap-client.php; then
            echo 'Planning hardening already applied.'
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path('includes/api/class-soap-client.php')
          text = path.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "            } catch (\\Exception $e) {\n                error_log('PontifexOI: SOAP client aanmaken gefaald: ' . $e->getMessage());\n                throw new \\Exception('SOAP client kon niet worden aangemaakt: ' . $e->getMessage());\n            }",
              "            } catch (\\Exception $e) {\n                error_log('PontifexOI: SOAP client aanmaken gefaald (' . get_class($e) . '); code=' . (int) $e->getCode());\n                throw new \\RuntimeException('SOAP client kon niet worden aangemaakt.', 0, $e);\n            }"
          )
          replace_once(
              "        $client = $this->getClient();\n        $seenIds = [];",
              "        $client = $this->getClient();\n        $seenIds = [];\n        $reconciliation_safe = true;"
          )
          replace_once(
              "                if (is_array($planning)) {\n                    $planning = (object) $planning;\n                }\n\n                $data = [\n                    'planning_identifier' => (string) ($planning->planning_identifier ?? ''),",
              "                if (is_array($planning)) {\n                    $planning = (object) $planning;\n                }\n\n                $planning_identifier = sanitize_text_field((string) ($planning->planning_identifier ?? ''));\n                if ($planning_identifier === '' || strlen($planning_identifier) > 64) {\n                    $reconciliation_safe = false;\n                    continue;\n                }\n\n                $data = [\n                    'planning_identifier' => $planning_identifier,"
          )
          replace_once(
              "                    'location_zip_code' => $planning->location?->location_zip_code ?? '',",
              "                    'location_postcode' => $planning->location?->location_zip_code ?? '',"
          )
          replace_once(
              "location_street, location_number, location_suffix, location_zip_code, location_city, location_province, location_country, location_seats)",
              "location_street, location_number, location_suffix, location_postcode, location_city, location_province, location_country, location_seats)"
          )
          replace_once(
              '''            // Verwijder planningen die niet meer in de API-respons zitten
            if (!empty($seenIds)) {
                $placeholders = implode(',', array_fill(0, count($seenIds), '%s'));
                $wpdb->query($wpdb->prepare(
                    "DELETE FROM {$table_name} WHERE planning_identifier NOT IN ($placeholders) AND planning_date >= CURDATE()",
                    ...$seenIds
                ));
            } else {
                // Verwijder alle toekomstige planningen als de API niets teruggeeft
                $wpdb->query("DELETE FROM {$table_name} WHERE planning_date >= CURDATE()");
            }
''',
              '''            // Alleen destructief reconciliëren als elk ontvangen record een geldige identifier had.
            // Een lege of malformed upstream response mag bestaande planning nooit weggooien.
            if ($reconciliation_safe && !empty($seenIds)) {
                $placeholders = implode(',', array_fill(0, count($seenIds), '%s'));
                $wpdb->query($wpdb->prepare(
                    "DELETE FROM {$table_name} WHERE planning_identifier NOT IN ($placeholders) AND planning_date >= CURDATE()",
                    ...$seenIds
                ));
            } elseif (!$reconciliation_safe) {
                error_log('PontifexOI: planning-reconciliatie overgeslagen wegens ongeldige upstream identifiers.');
            }
'''
          )
          replace_once(
              "        } catch (Exception $e) {\n            error_log('PontifexOI SOAP fout: ' . $e->getMessage() . ' | Trace: ' . $e->getTraceAsString());\n            if (method_exists($e, 'getResponse')) {\n                error_log('PontifexOI SOAP response: ' . $e->getResponse());\n            }\n            throw $e;\n        }",
              "        } catch (Exception $e) {\n            error_log('PontifexOI SOAP planning fetch failed (' . get_class($e) . '); code=' . (int) $e->getCode());\n            throw $e;\n        }"
          )
          path.write_text(text)
          PY

          php -l includes/api/class-soap-client.php
          git rm -f .github/workflows/planning-hardening-once.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add includes/api/class-soap-client.php
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: harden planning reconciliation and schema parity'
          git push origin HEAD:fix/bootstrap-and-compatibility-2026-09-09

  runtime:
    name: WordPress ${{ matrix.wordpress }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '6.0'
            php: '8.1'
          - wordpress: '7.1'
            php: '8.3'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mysqli, soap
          tools: composer:v2

      - name: Install and audit locked Composer dependencies
        shell: bash
        run: |
          set -euo pipefail
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --locked

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './.git/*' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Enforce payment privacy invariants
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq 'Ingediende order_details:' includes/helpers/class-payment-helpers.php
          ! grep -Fq 'Kandidaat namen:' includes/class-frontend.php
          ! grep -Fq 'Volledige order_data:' includes/class-frontend.php
          ! grep -Fq "'voor: ' . \$candidate_list" includes/class-frontend.php
          ! grep -Fq 'uniqid("pontifex_order_"' includes/class-frontend.php
          ! grep -Fq 'Mollie metadata inhoud:' public/class-payment-success-shortcode.php
          ! grep -Fq 'order_token gevonden:' public/class-payment-success-shortcode.php
          ! grep -Fq 'Sending mails triggered for order:' includes/helpers/class-mail-helpers.php
          ! grep -Fq 'print_r($wp_error, true)' includes/helpers/class-mail-helpers.php
          ! grep -Fq '"order_email" => sanitize_email' includes/helpers/class-payment-helpers.php
          grep -Fq "bin2hex(random_bytes(16))" includes/class-frontend.php
          grep -Fq "delete_transient('pontifex_order_data_for_token_' . \$order_token)" includes/webhooks/webhook-handler.php

      - name: Install verified WP-CLI 2.12.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --output /tmp/wp-cli.phar \
            https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          echo 'ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  /tmp/wp-cli.phar' | sha256sum --check --strict

      - name: Create clean WordPress runtime and activate plugin
        shell: bash
        run: |
          set -euo pipefail
          runtime=/tmp/pontifex-runtime
          plugin_dir="$runtime/wp-content/plugins/pontifex-oi"
          rm -rf "$runtime"
          php /tmp/wp-cli.phar core download --path="$runtime" --version='${{ matrix.wordpress }}' --locale=en_US --force
          php /tmp/wp-cli.phar config create --path="$runtime" --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306
          php /tmp/wp-cli.phar config set WP_DEBUG true --raw --path="$runtime"
          php /tmp/wp-cli.phar config set WP_DEBUG_LOG true --raw --path="$runtime"
          php /tmp/wp-cli.phar core install \
            --path="$runtime" \
            --url=http://pontifex.test \
            --title='Pontifex Runtime' \
            --admin_user=admin \
            --admin_password='runtime-only-password' \
            --admin_email=runtime@example.invalid \
            --skip-email
          mkdir -p "$plugin_dir"
          rsync -a --exclude='.git/' "$GITHUB_WORKSPACE/" "$plugin_dir/"
          rm -f "$runtime/wp-content/debug.log"
          php /tmp/wp-cli.phar plugin activate pontifex-oi --path="$runtime"
          php /tmp/wp-cli.phar plugin status pontifex-oi --path="$runtime"
          php /tmp/wp-cli.phar eval 'echo defined("PONTIFEX_OI_VERSION") ? PONTIFEX_OI_VERSION . "\n" : "missing\n";' --path="$runtime"

      - name: Reject runtime PHP errors
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          log=/tmp/pontifex-runtime/wp-content/debug.log
          [[ -f "$log" ]] || exit 0
          if grep -Eqi 'PHP (Fatal error|Parse error)' "$log"; then
            cat "$log"
            exit 1
          fi
          if grep -Ei 'PHP (Warning|Deprecated|Notice)' "$log" | grep -Fq '/wp-content/plugins/pontifex-oi/'; then
            cat "$log"
            exit 1
          fi
