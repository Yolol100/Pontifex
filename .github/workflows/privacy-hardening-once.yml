name: Privacy hardening once

on:
  push:
    branches:
      - fix/bootstrap-and-compatibility-2026-09-09

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/bootstrap-and-compatibility-2026-09-09

      - name: Apply exact privacy replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Mollie/payment helper: never log raw order payloads or external exception bodies.
          replace_once(
              'includes/helpers/class-payment-helpers.php',
              "        error_log('[Pontifex OI DEBUG][' . $log_context . '] Ingediende order_details: ' . print_r($order_details, true));\n        error_log('[Pontifex OI DEBUG][' . $log_context . '] Ingediende total_amount: ' . $total_amount);",
              "        error_log('[Pontifex OI DEBUG][' . $log_context . '] Payment creation started; candidates=' . (int) ($order_details['candidate_count'] ?? 0));"
          )
          replace_once(
              'includes/helpers/class-payment-helpers.php',
              "        error_log('[Pontifex OI DEBUG][' . $log_context . '] Herberekende totals (controle): ' . print_r($totals, true));\n        error_log('[Pontifex OI DEBUG][' . $log_context . '] Mollie amountStr: ' . $amountStr);",
              "        error_log('[Pontifex OI DEBUG][' . $log_context . '] Server-side payment total recalculated.');"
          )
          replace_once(
              'includes/helpers/class-payment-helpers.php',
              "                \"order_email\" => sanitize_email($customer_email),\n",
              ""
          )
          replace_once(
              'includes/helpers/class-payment-helpers.php',
              "            error_log(\"[Pontifex OI ERROR][\" . $log_context . \"] Mollie API fout: \" . $e->getMessage());\n            throw new \\RuntimeException(\"Mollie API fout: \" . $e->getMessage(), 0, $e);",
              "            error_log('[Pontifex OI ERROR][' . $log_context . '] Mollie API request failed; code=' . (int) $e->getCode());\n            throw new \\RuntimeException('Mollie API fout.', 0, $e);"
          )
          replace_once(
              'includes/helpers/class-payment-helpers.php',
              "            error_log(\"[Pontifex OI ERROR][\" . $log_context . \"] Algemene fout bij aanmaken betaling: \" . $e->getMessage());\n            throw new \\RuntimeException(\"Mollie betaling kon niet worden aangemaakt: \" . $e->getMessage(), 0, $e);",
              "            error_log('[Pontifex OI ERROR][' . $log_context . '] Payment creation failed (' . get_class($e) . '); code=' . (int) $e->getCode());\n            throw new \\RuntimeException('Mollie betaling kon niet worden aangemaakt.', 0, $e);"
          )
          replace_once(
              'includes/helpers/class-payment-helpers.php',
              "            error_log('[Pontifex OI ERROR][' . $log_context . '] Mollie ophalen fout: ' . $e->getMessage());",
              "            error_log('[Pontifex OI ERROR][' . $log_context . '] Mollie lookup failed; code=' . (int) $e->getCode());"
          )
          replace_once(
              'includes/helpers/class-payment-helpers.php',
              "            error_log('[Pontifex OI ERROR][' . $log_context . '] Algemene fout bij ophalen betaling: ' . $e->getMessage());",
              "            error_log('[Pontifex OI ERROR][' . $log_context . '] Payment lookup failed (' . get_class($e) . '); code=' . (int) $e->getCode());"
          )

          # Frontend: no candidate names/raw order payloads in logs or Mollie description.
          replace_once(
              'includes/class-frontend.php',
              "        error_log('[Pontifex OI DEBUG][' . self::get_log_context() . '] Kandidaat namen: ' . print_r($order_data['candidate_fullname'], true));\n",
              ""
          )
          replace_once(
              'includes/class-frontend.php',
              "            error_log('[Pontifex OI DEBUG][' . self::get_log_context() . '] Volledige order_data: ' . json_encode($order_data, JSON_PRETTY_PRINT));\n            error_log('[Pontifex OI DEBUG][' . self::get_log_context() . '] Herberekende totals: ' . json_encode($totals, JSON_PRETTY_PRINT));\n",
              ""
          )
          replace_once(
              'includes/class-frontend.php',
              "        $candidate_names = [];\n        foreach ($order_data['candidate_fullname'] as $key => $fullname) {\n            $infix = $order_data['candidate_infix'][$key] ?? '';\n            $lastname = $order_data['candidate_lastname'][$key] ?? '';\n            $candidate_names[] = trim($fullname . ' ' . $infix . ' ' . $lastname);\n        }\n        $candidate_list = implode(', ', array_filter($candidate_names));\n",
              ""
          )
          replace_once(
              'includes/class-frontend.php',
              "        if (!empty($candidate_list)) {\n            $description_parts[] = 'voor: ' . $candidate_list;\n        }\n",
              ""
          )
          replace_once(
              'includes/class-frontend.php',
              "            $order_token = uniqid(\"pontifex_order_\", true);",
              "            $order_token = 'pontifex_order_' . bin2hex(random_bytes(16));"
          )
          replace_once(
              'includes/class-frontend.php',
              "        } catch (\\Throwable $e) {\n            wp_send_json_error(['message' => 'Fout bij starten betaling: ' . $e->getMessage()]);\n        }",
              "        } catch (\\Throwable $e) {\n            error_log('[Pontifex OI ERROR][' . self::get_log_context() . '] Payment start failed (' . get_class($e) . ').');\n            wp_send_json_error(['message' => 'Fout bij starten betaling. Probeer het opnieuw.']);\n        }"
          )

          # Webhook: full transient order data is no longer needed after all side effects succeeded.
          replace_once(
              'includes/webhooks/webhook-handler.php',
              "        $state['complete'] = true;\n        $state['completed_at'] = time();\n        pontifex_oi_webhook_store_state($state_key, $state);\n\n        return new \\WP_REST_Response(['status' => 'ok'], 200);",
              "        $state['complete'] = true;\n        $state['completed_at'] = time();\n        pontifex_oi_webhook_store_state($state_key, $state);\n\n        if ($order_token !== '') {\n            delete_transient('pontifex_order_data_for_token_' . $order_token);\n        }\n\n        return new \\WP_REST_Response(['status' => 'ok'], 200);"
          )
          PY

      - name: Validate privacy invariants and PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l includes/helpers/class-payment-helpers.php
          php -l includes/class-frontend.php
          php -l includes/webhooks/webhook-handler.php
          php -l includes/helpers/class-mail-helpers.php
          php -l public/class-payment-success-shortcode.php

          ! grep -Fq 'Ingediende order_details:' includes/helpers/class-payment-helpers.php
          ! grep -Fq 'Kandidaat namen:' includes/class-frontend.php
          ! grep -Fq 'Volledige order_data:' includes/class-frontend.php
          ! grep -Fq "'voor: ' . \$candidate_list" includes/class-frontend.php
          ! grep -Fq 'uniqid("pontifex_order_"' includes/class-frontend.php
          ! grep -Fq 'Mollie metadata inhoud:' public/class-payment-success-shortcode.php
          ! grep -Fq 'order_token gevonden:' public/class-payment-success-shortcode.php
          ! grep -Fq 'Sending mails triggered for order:' includes/helpers/class-mail-helpers.php
          ! grep -Fq 'print_r($wp_error, true)' includes/helpers/class-mail-helpers.php

      - name: Commit hardened code and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/privacy-hardening-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add includes/helpers/class-payment-helpers.php includes/class-frontend.php includes/webhooks/webhook-handler.php
          git commit -m 'fix: minimize payment PII and secure order tokens'
          git push origin HEAD:fix/bootstrap-and-compatibility-2026-09-09
