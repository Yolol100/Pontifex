name: Postcode schema follow-up once

on:
  push:
    branches:
      - fix/bootstrap-and-compatibility-2026-09-09

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/bootstrap-and-compatibility-2026-09-09

      - name: Fix duplicate-update postcode column
        shell: bash
        run: |
          set -euo pipefail
          file=includes/api/class-soap-client.php
          test "$(grep -Fc 'location_zip_code = VALUES(location_zip_code)' "$file")" -eq 1
          sed -i 's/location_zip_code = VALUES(location_zip_code)/location_postcode = VALUES(location_postcode)/' "$file"
          php -l "$file"
          grep -Fq 'location_postcode = VALUES(location_postcode)' "$file"
          ! grep -Fq 'location_zip_code = VALUES(location_zip_code)' "$file"
          git rm .github/workflows/postcode-followup-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          git commit -m 'fix: keep planning postcode update schema aligned'
          git push origin HEAD:fix/bootstrap-and-compatibility-2026-09-09
